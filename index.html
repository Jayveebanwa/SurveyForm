<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <title>Survey Form</title>
</head>
<body>
    <div id="container">
        <header>
            <h1>Survey Form</h1>
            <p>Help protect human rights. Thank you for your time!</p>
        </header>

        <form id="survey-form">

            <!-- Name -->
            <div class="form-group">
                <label for="name">Name</label>
                <input id="name" type="text" placeholder="eg. Juan Dela Cruz" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="eg. you@example.com" required>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label for="number">Age</label>
                <input id="number" type="number" min="1" max="100" placeholder="eg. 45" required>
            </div>

            <!-- Sex -->
            <div class="form-group question">
                <label>Sex</label>
                <label class="option-label"><input type="radio" name="sex" value="male" required>Male</label>
                <label class="option-label"><input type="radio" name="sex" value="female">Female</label>
            </div>

            <!-- Religion -->
            <div class="form-group question">
                <label for="dropdown">Religion</label>
                <select id="dropdown" name="dropdown">
                    <option value="Roman Catholic">Roman Catholic</option>
                    <option value="Islam">Islam</option>
                    <option value="INC">Iglesia ni Cristo (iNC)</option>
                    <option value="Jehovah's Witnesses">Jehovah's Witnesses</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <!-- Question 1 -->
            <div class="form-group question">
                <label>1. Which human rights issues are you most concerned about? (Select all that apply)</label>
                <label class="option-label"><input type="checkbox" name="Q1O1" value="Freedom of Speech">Freedom of Speech</label>
                <label class="option-label"><input type="checkbox" name="Q1O2" value="Discrimination">Discrimination and inequality</label>
                <label class="option-label"><input type="checkbox" name="Q1O3" value="Child protection">Child protection</label>
                <label class="option-label"><input type="checkbox" name="Q1O4" value="Gender violence">Gender based violence</label>
                <label class="option-label"><input type="checkbox" name="Q1O5" value="Privacy">Privacy and data protection</label>
                <label class="option-label"><input type="checkbox" name="Q1O6" value="Education">Access to education</label>
                <label class="option-label"><input type="checkbox" name="Q1O7" value="Healthcare">Access to healthcare</label>
                <label class="option-label"><input type="checkbox" name="Q1O8" value="Labor rights">Labor rights and fair wages</label>
            </div>

            <!-- Question 2 -->
            <div class="form-group question">
                <label>2. In what ways are you willing to participate in protecting human rights? (Select all that apply)</label>
                <label class="option-label"><input type="checkbox" name="Q2O1" value="Petitions">Signing petitions</label>
                <label class="option-label"><input type="checkbox" name="Q2O2" value="Campaigns">Attending awareness campaigns</label>
                <label class="option-label"><input type="checkbox" name="Q2O3" value="Donations">Donating to human rights organizations</label>
                <label class="option-label"><input type="checkbox" name="Q2O4" value="Sharing content">Sharing educational content</label>
                <label class="option-label"><input type="checkbox" name="Q2O5" value="Volunteering">Volunteering for community programs</label>
                <label class="option-label"><input type="checkbox" name="Q2O6" value="Reporting">Reporting human rights violations</label>
            </div>

            <!-- Question 3 -->
            <div class="form-group question">
                <label>3. What types of support do you think communities need the most? (Select all that apply)</label>
                <label class="option-label"><input type="checkbox" name="Q3O1" value="Legal assistance">Legal assistance</label>
                <label class="option-label"><input type="checkbox" name="Q3O2" value="Mental health">Mental health support</label>
                <label class="option-label"><input type="checkbox" name="Q3O3" value="Financial aid">Financial aid</label>
                <label class="option-label"><input type="checkbox" name="Q3O4" value="Education programs">Educational programs and workshops</label>
                <label class="option-label"><input type="checkbox" name="Q3O5" value="Shelters">Safe spaces/shelters</label>
                <label class="option-label"><input type="checkbox" name="Q3O6" value="Transparency">Government transparency and accountability</label>
            </div>

            <!-- Question 4 -->
            <div class="form-group question">
                <label>4. How do you prefer to receive information about human rights? (Select all that apply)</label>
                <label class="option-label"><input type="checkbox" name="Q4O1" value="Social media">Social media posts</label>
                <label class="option-label"><input type="checkbox" name="Q4O2" value="Articles">News articles</label>
                <label class="option-label"><input type="checkbox" name="Q4O3" value="Workshops">School or community workshops</label>
                <label class="option-label"><input type="checkbox" name="Q4O4" value="Announcements">Government announcements</label>
                <label class="option-label"><input type="checkbox" name="Q4O5" value="Videos">Online videos or documentaries</label>
                <label class="option-label"><input type="checkbox" name="Q4O6" value="Podcasts">Podcasts or radio programs</label>
            </div>

            <!-- Additional Comments -->
            <div class="form-group">
                <label for="comments">Additional Comments</label>
                <textarea id="comments" name="comments" placeholder="Enter additional comments here..." rows="6"></textarea>
            </div>

            <!-- Submit -->
            <button class="btn-submit" type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
